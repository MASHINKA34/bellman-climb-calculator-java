plugins {
    id 'com.android.application'
}

android {
    namespace = 'ru.mashinka.multiflow.android'
    compileSdk = 36

    defaultConfig {
        applicationId = 'ru.mashinka.multiflow'
        minSdk = 29          // Android 10
        targetSdk = 36
        versionCode = 2
        versionName = '1.1.0'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // Ядро подключается напрямую из модуля core - те же файлы, что проходят тесты,
            // а не их копия. Ради этого core и написан на чистой Java без зависимостей.
            java.srcDir '../../core/src/main/java'

            // Экран - общая папка ui: index.html, styles.css, app.js и android-bridge.js.
            // На втором этапе из неё же соберётся сайт.
            assets.srcDir '../../ui'
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }
}
